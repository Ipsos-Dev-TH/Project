# Project Management System - Build and Deploy Workflow
# Builds and deploys on the self-hosted IIS runner (no artifacts, no Git required on the runner).
# Pull requests are intentionally NOT built here: untrusted PR code must never run on the IIS host.

name: Build and Deploy Project

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-iis
  cancel-in-progress: false

env:
  SOLUTION_PATH: Project.sln
  PROJECT_PATH: Project/Project.csproj
  BUILD_CONFIGURATION: Release

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout code
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Get-ChildItem -Path "${{ github.workspace }}" -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $headers = @{
            "Authorization" = "Bearer ${{ github.token }}"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $zipUrl = "https://api.github.com/repos/${{ github.repository }}/zipball/${{ github.sha }}"
          $zipPath = Join-Path $env:RUNNER_TEMP "repo-${{ github.run_id }}.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "repo-${{ github.run_id }}"

          Write-Host "Downloading ${{ github.sha }}"
          Invoke-WebRequest -Uri $zipUrl -Headers $headers -OutFile $zipPath -UseBasicParsing

          if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractPath)

          $nestedFolder = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          Get-ChildItem -Path $nestedFolder.FullName -Force | Move-Item -Destination "${{ github.workspace }}" -Force

          Remove-Item $zipPath -Force
          Remove-Item $extractPath -Recurse -Force
        shell: powershell

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_PATH }}

      - name: Build and publish
        run: |
          $publishDir = "${{ github.workspace }}\publish"
          msbuild ${{ env.PROJECT_PATH }} `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=AnyCPU `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="$publishDir" `
            /p:DeleteExistingFiles=true `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { Write-Error "Build/publish failed"; exit 1 }

          if (-not (Test-Path "$publishDir\bin\Project.dll")) {
            Write-Error "Publish output is missing bin\Project.dll"
            exit 1
          }
          $sourceFiles = Get-ChildItem $publishDir -Recurse -Include *.cs, *.csproj -File
          if ($sourceFiles) {
            $sourceFiles | ForEach-Object { Write-Host "Unexpected source file: $($_.FullName)" }
            Write-Error "Publish output contains source files"
            exit 1
          }
          Write-Host "Published files: $((Get-ChildItem $publishDir -Recurse -File).Count)"
        shell: powershell

      - name: Deploy to IIS
        run: |
          $deployPath = "${{ vars.IIS_DEPLOY_PATH }}"
          if (-not $deployPath) { Write-Error "IIS_DEPLOY_PATH variable not set"; exit 1 }
          if (-not (Test-Path $deployPath)) { New-Item -ItemType Directory -Path $deployPath -Force | Out-Null }

          $sourcePath = "${{ github.workspace }}\publish"
          $offline = Join-Path $deployPath "app_offline.htm"
          Set-Content -Path $offline -Encoding UTF8 -Value '<html><body style="font-family:sans-serif;text-align:center;padding-top:15%"><h2>Updating Project Management...</h2><p>Please try again in a minute.</p></body></html>'
          Start-Sleep -Seconds 3

          try {
            # Web.config holds server-specific settings (connection string, AdminEmails) and is never overwritten.
            # Upload and App_Data hold server data and are never touched.
            robocopy $sourcePath $deployPath /E /IS /IT /R:3 /W:5 /NFL /NDL /NJH /NP `
              /XF Web.config app_offline.htm /XD Upload App_Data
            if ($LASTEXITCODE -ge 8) { Write-Error "Robocopy failed with exit code $LASTEXITCODE"; exit 1 }

            $destConfig = Join-Path $deployPath "Web.config"
            if (-not (Test-Path $destConfig)) {
              Copy-Item (Join-Path $sourcePath "Web.config") -Destination $destConfig
              Write-Host "Created Web.config (first deploy) - update its connection string and AdminEmails on the server"
            } else {
              Write-Host "Preserved server Web.config"
            }
          }
          finally {
            Remove-Item $offline -Force -ErrorAction SilentlyContinue
          }

          $global:LASTEXITCODE = 0
        shell: powershell

      - name: Deployment summary
        run: |
          Write-Host "========================================"
          Write-Host "Deployment completed successfully"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Deployed by: ${{ github.actor }}"
          Write-Host "========================================"
        shell: powershell

      - name: Cleanup
        if: always()
        run: |
          Remove-Item -Path "${{ github.workspace }}\publish" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell
